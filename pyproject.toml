[project]
name = "lira-sapr-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents drive LIRA-SAPR (LIRA-FEM) through its COM API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pywin32>=311; sys_platform == 'win32'",
]

[project.scripts]
lira-sapr-mcp = "lira_sapr_mcp.__main__:main"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.13",
    "zensical==0.0.72",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lira_sapr_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Throwaway experiment scripts against live LIRA; kept for reference, not product code.
extend-exclude = ["spikes"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not lira'"
markers = [
    "lira: needs a running licensed LIRA-SAPR on this machine (run with -m lira)",
]
